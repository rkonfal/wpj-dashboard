<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generátor bannerů – Království tianDe</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0b1020;
  --s1:       #111827;
  --s2:       #131929;
  --s3:       #1a2235;
  --b:        rgba(255,255,255,0.07);
  --text:     #e2e8f0;
  --muted:    rgba(255,255,255,0.42);
  --gold:     #d4af37;
  --gold-h:   #e8c84a;
  --gold-dim: rgba(212,175,55,0.11);
  --red:      #f06b6b;
  --green:    #43d17c;
  --blue:     #6ea8ff;
  --r:        7px;
  --r2:       12px;
  --topbar:   52px;
  --feed:     49px;
  --sidebar:  284px;
}

body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.hidden { display: none !important; }

/* ── Topbar ───────────────────────────────────────── */
.topbar {
  height: var(--topbar);
  background: linear-gradient(90deg, #0d1630 0%, #131929 100%);
  border-bottom: 1px solid var(--b);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; z-index: 20; position: relative;
}
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px rgba(212,175,55,.55); flex-shrink: 0; }
.brand-name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.brand-name em { font-style: normal; color: var(--gold); }
.brand-tag {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 20px;
  background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(212,175,55,.22);
}
.topbar-right { display: flex; align-items: center; gap: 8px; }

/* ── Feed bar ─────────────────────────────────────── */
.feed-bar {
  height: var(--feed);
  background: var(--s1); border-bottom: 1px solid var(--b);
  display: flex; align-items: center; gap: 10px; padding: 0 16px;
}
.feed-bar-label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.feed-bar input { flex: 1; min-width: 0; }
#feed-status { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 90px; transition: color .3s; }
#feed-status.ok  { color: var(--green); }
#feed-status.err { color: var(--red); }

/* ── Layout ───────────────────────────────────────── */
.app-layout {
  display: flex;
  height: calc(100vh - var(--topbar) - var(--feed));
  overflow: hidden;
}

/* ── Sidebar ──────────────────────────────────────── */
.sidebar {
  width: var(--sidebar); background: var(--s1);
  border-right: 1px solid var(--b);
  display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
}
.sidebar-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px 8px; border-bottom: 1px solid var(--b);
}
.sidebar-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.sidebar-badge {
  font-size: 11px; font-weight: 700; color: var(--muted);
  background: var(--s3); padding: 2px 8px; border-radius: 20px;
}
.sidebar-search { padding: 8px 10px 4px; }
.search-wrap { position: relative; }
.search-wrap input { padding-left: 28px; }
.search-ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none; }
.sidebar-products { flex: 1; overflow-y: auto; padding: 4px 7px 7px; }
.sidebar-empty {
  padding: 28px 14px; text-align: center;
  color: var(--muted); font-size: 13px; line-height: 1.7;
}
.sidebar-empty-ico { font-size: 30px; opacity: .35; color: var(--gold); margin-bottom: 8px; }

/* ── Product item ─────────────────────────────────── */
.product-item {
  display: flex; align-items: center; gap: 9px;
  background: var(--s2); border: 1px solid var(--b); border-radius: var(--r);
  padding: 7px 9px; margin-bottom: 4px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.product-item:hover { border-color: rgba(212,175,55,.35); }
.product-item.selected { border-color: var(--gold); background: var(--gold-dim); }
.p-thumb {
  width: 38px; height: 38px; border-radius: 5px; object-fit: contain;
  background: var(--s3); flex-shrink: 0; display: block;
}
.p-thumb-ph {
  width: 38px; height: 38px; border-radius: 5px; background: var(--s3);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--muted);
}
.p-text { flex: 1; min-width: 0; }
.p-title {
  font-size: 12px; font-weight: 500; line-height: 1.35;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  margin-bottom: 3px;
}
.p-meta { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.p-code { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-price { font-size: 12px; color: var(--gold); font-weight: 700; white-space: nowrap; }

/* ── Sidebar bundles ──────────────────────────────── */
.sidebar-bundles { border-top: 1px solid var(--b); padding: 9px 11px; }
.sb-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; font-weight: 600; color: var(--muted); }
.bundle-item {
  background: var(--s3); border: 1px solid var(--b); border-radius: 6px;
  padding: 6px 9px; margin-bottom: 4px; cursor: pointer; font-size: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.bundle-item:hover { border-color: rgba(212,175,55,.3); }

/* ── Inputs ───────────────────────────────────────── */
input[type=text], input[type=url], textarea, select {
  background: var(--s3); border: 1px solid rgba(255,255,255,.09);
  border-radius: 6px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  padding: 7px 10px; width: 100%; outline: none; transition: border-color .15s;
}
input[type=text]:focus, input[type=url]:focus, textarea:focus, select:focus { border-color: rgba(212,175,55,.45); }
input[type=range] { width: 100%; accent-color: var(--gold); cursor: pointer; }
textarea { resize: vertical; min-height: 54px; }

/* ── Buttons ──────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 6px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; border: none; transition: all .15s; white-space: nowrap; line-height: 1;
}
.btn-primary { background: var(--gold); color: #1a1a2e; }
.btn-primary:hover { background: var(--gold-h); }
.btn-primary:active { transform: scale(.97); }
.btn-outline { background: transparent; color: rgba(255,255,255,.65); border: 1px solid rgba(255,255,255,.13); }
.btn-outline:hover { border-color: rgba(255,255,255,.28); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-lg { width: 100%; justify-content: center; padding: 12px; font-size: 15px; margin-top: 14px; border-radius: var(--r); }
.btn-ghost { background: transparent; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 4px 7px; transition: color .15s; }
.btn-ghost:hover { color: #fff; }
.btn-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px; line-height: 1; transition: color .15s; }
.btn-close:hover { color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }

/* ── Main workspace ───────────────────────────────── */
.main-workspace { flex: 1; overflow-y: auto; background: var(--bg); }
.stage { min-height: 100%; }

/* ── Stage: select ────────────────────────────────── */
.stage-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: calc(100vh - 110px); gap: 10px; padding: 40px; text-align: center;
}
.stage-empty-ico { font-size: 44px; opacity: .28; color: var(--gold); }
.stage-empty h2 { font-size: 20px; font-weight: 600; color: rgba(255,255,255,.5); }
.stage-empty p { font-size: 14px; color: rgba(255,255,255,.28); }

/* ── Stage: configure ─────────────────────────────── */
.configure-panel { max-width: 680px; margin: 36px auto; padding: 0 24px; }
.cfg-preview {
  background: var(--s2); border: 1px solid var(--b);
  border-radius: var(--r2); padding: 20px; margin-bottom: 18px;
  display: flex; gap: 16px; align-items: flex-start;
}
.cfg-img { width: 86px; height: 86px; object-fit: contain; border-radius: 8px; background: var(--s3); flex-shrink: 0; }
.cfg-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.cfg-info .code { font-size: 12px; color: var(--muted); }
.cfg-info .price { font-size: 20px; font-weight: 800; color: var(--gold); margin-top: 5px; }
.cfg-options { background: var(--s2); border: 1px solid var(--b); border-radius: var(--r2); padding: 20px; }
.field-group { margin-bottom: 16px; }
.field-group:last-child { margin-bottom: 0; }
.field-group > label {
  display: block; font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px;
}
.tpl-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tpl-check-item {
  display: flex; align-items: center; gap: 8px;
  background: var(--s3); border: 1px solid var(--b); border-radius: 7px;
  padding: 8px 11px; cursor: pointer; font-size: 12px; user-select: none; transition: border-color .15s;
}
.tpl-check-item:hover { border-color: rgba(212,175,55,.3); }
.tpl-check-item input { accent-color: var(--gold); width: 14px; height: 14px; flex-shrink: 0; }

/* ── Stage: workspace ─────────────────────────────── */
.ws-topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 18px; border-bottom: 1px solid var(--b);
  background: rgba(13,21,38,.9); backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 10;
}
.ws-name { flex: 1; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-actions { display: flex; gap: 7px; }

/* ── Filter bar ───────────────────────────────────── */
.ws-filter-bar {
  display: flex; align-items: center; gap: 5px;
  padding: 8px 18px; border-bottom: 1px solid var(--b); background: var(--bg);
}
.ftab {
  padding: 4px 13px; border-radius: 20px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: 1px solid var(--b);
  background: transparent; color: var(--muted);
  font-family: 'DM Sans', sans-serif; transition: all .15s;
}
.ftab:hover { border-color: rgba(255,255,255,.2); color: var(--text); }
.ftab.active { background: var(--s3); border-color: rgba(255,255,255,.18); color: var(--text); }
.ftab .tc {
  display: inline-block; background: var(--s3); color: var(--muted);
  font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 20px; margin-left: 4px;
}
.ftab.active .tc { background: var(--gold-dim); color: var(--gold); }
.filter-spacer { flex: 1; }
.fmt-toggle { display: flex; gap: 3px; background: var(--s3); padding: 3px; border-radius: 7px; }
.fmt-btn {
  padding: 3px 9px; border-radius: 5px; font-size: 11px; font-weight: 600;
  cursor: pointer; border: none; background: transparent; color: var(--muted);
  font-family: 'DM Sans', sans-serif; transition: all .15s;
}
.fmt-btn:hover { color: var(--text); }
.fmt-btn.active { background: var(--s1); color: var(--text); }

/* ── Variant grid ─────────────────────────────────── */
.variant-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
  gap: 16px; padding: 18px;
}
@keyframes cardIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }
.variant-card {
  background: var(--s2); border: 1px solid var(--b); border-radius: var(--r2);
  overflow: hidden; animation: cardIn .22s ease both; transition: border-color .2s;
}
.variant-card:hover { border-color: rgba(255,255,255,.12); }
.variant-card.is-approved { border-color: rgba(67,209,124,.24); }
.variant-card.is-rejected { border-color: rgba(240,107,107,.18); opacity: .6; }
.vc-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 13px; border-bottom: 1px solid var(--b);
}
.vc-meta { display: flex; align-items: center; gap: 8px; }
.vc-tpl { font-size: 12px; font-weight: 600; }
.scheme-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.2); flex-shrink: 0; }
.status-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: .06em; }
.status-pending  { background: rgba(110,168,255,.12); color: var(--blue); }
.status-approved { background: rgba(67,209,124,.12);  color: var(--green); }
.status-rejected { background: rgba(240,107,107,.12); color: var(--red); }
.vc-headline { font-size: 12px; color: var(--muted); padding: 5px 13px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vc-previews { display: grid; gap: 3px; padding: 9px; background: var(--bg); }
.vc-previews.g4 { grid-template-columns: 1fr 1fr; }
.vc-previews.g1 { grid-template-columns: 1fr; }
.vp-item { position: relative; cursor: pointer; }
.vp-img { width: 100%; border-radius: 4px; display: block; background: var(--s3); }
.vp-label {
  position: absolute; bottom: 4px; left: 4px;
  background: rgba(0,0,0,.65); color: #fff;
  font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
}
.vc-actions { display: flex; gap: 4px; padding: 8px 10px; flex-wrap: wrap; border-top: 1px solid var(--b); }

/* ── Loading overlay ──────────────────────────────── */
.gen-overlay {
  position: fixed; inset: 0;
  background: rgba(11,16,32,.88); backdrop-filter: blur(8px);
  z-index: 50; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
}
.gen-spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(212,175,55,.18); border-top-color: var(--gold);
  border-radius: 50%; animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.gen-label { font-size: 16px; font-weight: 700; color: var(--text); }
.gen-sub   { font-size: 13px; color: var(--muted); }
.gen-prog-wrap { width: 220px; height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
.gen-prog { height: 100%; background: var(--gold); border-radius: 2px; transition: width .3s ease; width: 0%; }

/* ── Editor modal ─────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.75); z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
.modal-editor {
  display: flex; width: 95vw; max-width: 1320px; height: 90vh;
  background: var(--s1); border-radius: 14px; overflow: hidden;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 32px 80px rgba(0,0,0,.6);
}
.modal-ed-left {
  flex: 1; background: var(--bg); padding: 16px; overflow-y: auto;
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start;
}
.modal-ed-right { width: 355px; display: flex; flex-direction: column; border-left: 1px solid var(--b); }
.modal-ed-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 17px; border-bottom: 1px solid var(--b);
}
.modal-ed-hdr h3 { font-size: 14px; font-weight: 700; }
.editor-fields { flex: 1; overflow-y: auto; padding: 13px 17px; display: flex; flex-direction: column; gap: 12px; }
.ep-img { width: 100%; border-radius: 6px; border: 1px solid var(--b); display: block; background: var(--s3); }
.ep-label { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: center; }
.editor-field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
.tpl-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.tpl-option {
  background: var(--s3); border: 2px solid var(--b); border-radius: 7px;
  padding: 7px 9px; cursor: pointer; font-size: 12px; text-align: center;
  transition: all .15s; color: var(--text); font-family: 'DM Sans', sans-serif;
}
.tpl-option:hover { border-color: rgba(212,175,55,.3); }
.tpl-option.selected { border-color: var(--gold); background: var(--gold-dim); color: var(--gold); }
.tpl-option-ico { font-size: 17px; display: block; margin-bottom: 3px; }
.scheme-sel { display: flex; gap: 7px; flex-wrap: wrap; }
.scheme-opt {
  width: 33px; height: 33px; border-radius: 50%;
  border: 2.5px solid transparent; cursor: pointer; transition: all .15s;
}
.scheme-opt.selected { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
.scheme-opt:hover { transform: scale(1.1); }
.ben-list { display: flex; flex-direction: column; gap: 5px; }
.ben-item { display: flex; align-items: center; gap: 5px; }
.ben-item input { flex: 1; }
.ben-item .btn-ghost { padding: 3px; }
.asset-btns { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 7px; }
.asset-btn {
  padding: 4px 11px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid rgba(255,255,255,.1); background: transparent;
  color: rgba(255,255,255,.55); font-family: 'DM Sans', sans-serif; transition: all .15s;
}
.asset-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
.ed-footer {
  display: flex; gap: 7px; padding: 11px 17px; border-top: 1px solid var(--b);
}
.ed-footer .btn { flex: 1; justify-content: center; }

/* ── Standard modal ───────────────────────────────── */
.modal-std {
  background: var(--s1); border-radius: 14px; border: 1px solid var(--b);
  width: 90vw; max-width: 600px; max-height: 85vh;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 60px rgba(0,0,0,.5);
}
.modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 13px 17px; border-bottom: 1px solid var(--b); }
.modal-hdr h3 { font-size: 14px; font-weight: 700; }
.modal-body { flex: 1; overflow-y: auto; padding: 13px 17px; }
.modal-foot { padding: 11px 17px; border-top: 1px solid var(--b); display: flex; gap: 7px; }
.proj-item {
  background: var(--s3); border: 1px solid var(--b); border-radius: 8px;
  padding: 11px 13px; margin-bottom: 6px;
  display: flex; align-items: center; gap: 11px;
}
.proj-info { flex: 1; }
.proj-name { font-size: 14px; font-weight: 600; }
.proj-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.proj-actions { display: flex; gap: 5px; }

/* ── Misc ─────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.11); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); }
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--s2); border: 1px solid var(--b); border-radius: 9px;
  padding: 10px 17px; font-size: 13px; font-weight: 500; z-index: 999;
  transform: translateY(14px); opacity: 0; transition: all .2s; pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: rgba(67,209,124,.28); color: var(--green); }
.toast.error   { border-color: rgba(240,107,107,.28); color: var(--red); }
  </style>
</head>
<body>
  <div id="app">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-brand">
        <div class="brand-dot"></div>
        <div class="brand-name">Království <em>tianDe</em></div>
        <div class="brand-tag">Generátor bannerů</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-outline btn-sm" id="btn-projects">📁 Projekty</button>
      </div>
    </div>

    <!-- Feed bar -->
    <div class="feed-bar">
      <span class="feed-bar-label">Feed</span>
      <input type="text" id="inp-feed-url"
        value="https://www.kralovstvi-tiande.cz/feed/23/db0fa65b3fb4fa6ad3e44be839cc31b9a9b34b7b"
        placeholder="https://…/feed (Heureka XML, Google XML nebo JSON)" />
      <button class="btn btn-primary" id="btn-load-feed">Načíst feed</button>
      <span id="feed-status"></span>
    </div>

    <!-- App layout -->
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-hdr">
          <span class="sidebar-title">Produkty</span>
          <span class="sidebar-badge" id="sidebar-count">0</span>
        </div>
        <div class="sidebar-search">
          <div class="search-wrap">
            <span class="search-ico">⌕</span>
            <input type="text" id="inp-search" placeholder="Hledat produkt nebo kód…" />
          </div>
        </div>
        <div class="sidebar-products" id="sidebar-products">
          <div class="sidebar-empty">
            <div class="sidebar-empty-ico">◈</div>
            <p>Klikněte na <strong>Načíst feed</strong><br>pro zobrazení produktů</p>

  <script>
'use strict';

// ─────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────
const FORMATS = [

const COLOR_SCHEMES = [
  { id:'gold_dark',  name:'Gold & Dark',    bg:'#1a1a2e', bg2:'#16213e', accent:'#d4af37', accent2:'#f0c040', text:'#ffffff', textMuted:'rgba(255,255,255,0.6)', btnBg:'#d4af37', btnText:'#1a1a2e' },
  { id:'crimson',    name:'Crimson & White', bg:'#ffffff', bg2:'#fdf0f0', accent:'#c41e3a', accent2:'#e83c5a', text:'#1a1a1a', textMuted:'#666666',               btnBg:'#c41e3a', btnText:'#ffffff' },
  { id:'teal_light', name:'Teal Light',      bg:'#f0faf8', bg2:'#e0f4f0', accent:'#00897b', accent2:'#26a69a', text:'#1a2e2b', textMuted:'#4a6b66',               btnBg:'#00897b', btnText:'#ffffff' },
  { id:'midnight',   name:'Midnight Purple', bg:'#1a0a2e', bg2:'#2d1b69', accent:'#a78bfa', accent2:'#c4b5fd', text:'#ffffff', textMuted:'rgba(255,255,255,0.6)', btnBg:'#a78bfa', btnText:'#1a0a2e' },
  { id:'warm_sand',  name:'Warm Sand',       bg:'#fdf6ec', bg2:'#f5e8d0', accent:'#8b5e3c', accent2:'#a07040', text:'#2c1a0e', textMuted:'#6b4226',               btnBg:'#8b5e3c', btnText:'#ffffff' },
];

const TEMPLATES = [
  { id:'clean_packshot', name:'Clean Packshot', icon:'◫' },
  { id:'arrow_benefits', name:'Se šipkama',     icon:'◈' },

];

const CTA_OPTIONS   = ['Koupit nyní','Zjistit více','Objednat','Vyzkoušet','Přidat do košíku','Zobrazit produkt'];
const BADGE_OPTIONS = ['','NOVINKA','BESTSELLER','TOP PRODUKT','VÝPRODEJ',''];
const PROJECTS_KEY  = 'tiande_banner_projects_v1';
const FEED_URL_KEY  = 'tiande_feed_url_v1';
const DEFAULT_FEED  = 'https://www.kralovstvi-tiande.cz/feed/23/db0fa65b3fb4fa6ad3e44be839cc31b9a9b34b7b';
const FEED_PROXY    = 'https://tiande-proxy.rkonfal-rk.workers.dev/feed';

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const APP = {
  products: [],
  bundles: [],
  selectedProduct: null,
  variants: [],
  editingVariantId: null,
  project: null,
  activeFilter: 'all',
  activeFormat: 'all',

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
const $ = id => document.getElementById(id);

function uid() { return Math.random().toString(36).slice(2,10); }

function formatPrice(n) {
  if (!n || n <= 0) return '';
  return new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',maximumFractionDigits:0}).format(n);
}

function pick(arr, i) { return arr[((i % arr.length) + arr.length) % arr.length]; }

let _toastTimer;
function showToast(msg, type='success') {
  let t = $('toast');
  if (!t) { t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ t.className=`toast ${type}`; }, 3200);
}

function downloadBlob(urlOrBlob, filename) {
  const a = document.createElement('a');
  a.href = typeof urlOrBlob === 'string' ? urlOrBlob : URL.createObjectURL(urlOrBlob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

function hexToRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function getScheme(id) { return COLOR_SCHEMES.find(c=>c.id===id) || COLOR_SCHEMES[0]; }

function setProgress(pct, label, sub) {
  $('gen-prog').style.width = pct + '%';
  if (label) $('gen-label').textContent = label;
  if (sub)   $('gen-sub').textContent   = sub;
}
function showOverlay(label, sub) { setProgress(0, label, sub); $('gen-overlay').classList.remove('hidden'); }
function hideOverlay() { $('gen-overlay').classList.add('hidden'); }

// ─────────────────────────────────────────────
// CANVAS PRIMITIVES
// ─────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxW, lh, align='left') {
  if (!text) return 0;
  const words = String(text).split(' ');
  const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line+' '+w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line=w; }
    else line=test;
  }
  if (line) lines.push(line);
  const saved = ctx.textAlign; ctx.textAlign=align;
  lines.forEach((l,i)=>ctx.fillText(l, x, y+i*lh));
  ctx.textAlign=saved;
  return lines.length;
}

function imgContain(ctx, img, x, y, w, h, placeholder='') {
  if (!img) {
    ctx.save(); ctx.fillStyle='rgba(150,150,150,0.1)'; roundRect(ctx,x,y,w,h,8); ctx.fill();
    if (placeholder) {
      ctx.fillStyle='rgba(150,150,150,0.4)'; ctx.font='12px "DM Sans",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(placeholder,x+w/2,y+h/2);
    }
    ctx.restore(); return;
  }
  const s=Math.min(w/img.naturalWidth,h/img.naturalHeight);
  ctx.drawImage(img, x+(w-img.naturalWidth*s)/2, y+(h-img.naturalHeight*s)/2, img.naturalWidth*s, img.naturalHeight*s);
}

function drawGradBg(ctx, W, H, c1, c2, angle=135) {
  const r=angle*Math.PI/180, cx=W/2, cy=H/2, len=Math.hypot(W,H)/2;
  const g=ctx.createLinearGradient(cx-Math.cos(r)*len, cy-Math.sin(r)*len, cx+Math.cos(r)*len, cy+Math.sin(r)*len);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawArrow(ctx, x1, y1, x2, y2, color='#888', lw=1.5, hs=8) {
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2); ctx.lineTo(x2-hs*Math.cos(a-Math.PI/6), y2-hs*Math.sin(a-Math.PI/6));
  ctx.moveTo(x2,y2); ctx.lineTo(x2-hs*Math.cos(a+Math.PI/6), y2-hs*Math.sin(a+Math.PI/6));
  ctx.stroke(); ctx.restore();
}

function drawLogo(ctx, x, y, color, size=11) {
  ctx.save(); ctx.fillStyle=color; ctx.font=`600 ${size}px "DM Sans",sans-serif`;
  ctx.textAlign='right'; ctx.textBaseline='bottom'; ctx.fillText('Království tianDe',x,y); ctx.restore();
}

function drawBadge(ctx, text, cx, cy, bg, fg, fs=12) {
  if (!text) return;
  ctx.save(); ctx.font=`700 ${fs}px "DM Sans",sans-serif`;
  const tw=ctx.measureText(text).width, ph=fs+10, pw=tw+ph;
  ctx.fillStyle=bg; roundRect(ctx,cx-pw/2,cy-ph/2,pw,ph,ph/2); ctx.fill();
  ctx.fillStyle=fg; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,cx,cy); ctx.restore();
}

function drawBtn(ctx, text, x, y, w, h, bg, fg, r=8) {
  if (!text) return;
  ctx.save(); ctx.fillStyle=bg; roundRect(ctx,x,y,w,h,r); ctx.fill();
  ctx.fillStyle=fg; ctx.font=`700 ${Math.round(h*0.38)}px "DM Sans",sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,x+w/2,y+h/2); ctx.restore();
}

// ─────────────────────────────────────────────
// IMAGE CACHE
// ─────────────────────────────────────────────
const IMG_CACHE = new Map();
function loadImg(url) {
  if (!url) return Promise.resolve(null);
  if (IMG_CACHE.has(url)) return IMG_CACHE.get(url);
  const p = new Promise(res=>{
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>res(img); img.onerror=()=>res(null); img.src=url;
  });
  IMG_CACHE.set(url,p); return p;
}

// ─────────────────────────────────────────────
// TEMPLATE RENDERERS
// ─────────────────────────────────────────────
function tplCleanPackshot(ctx, v, fmt, img) {
  const cs=getScheme(v.colorScheme), W=fmt.width, H=fmt.height;
  drawGradBg(ctx,W,H,cs.bg,cs.bg2);
  ctx.save(); ctx.globalAlpha=0.07; ctx.fillStyle=cs.accent;
  ctx.beginPath(); ctx.ellipse(W*0.78,H*0.5,H*0.55,H*0.55,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  let iX,iY,iW,iH, tX,tY,tMaxW;
  const portrait = fmt.id==='f45'||fmt.id==='f916';
  if (fmt.id==='f169') { iX=W*0.46;iY=H*0.06;iW=W*0.50;iH=H*0.88; tX=55;tY=H*0.14;tMaxW=W*0.38; }
  else if (fmt.id==='f11') { iX=W*0.44;iY=H*0.08;iW=W*0.50;iH=H*0.84; tX=44;tY=H*0.14;tMaxW=W*0.38; }
  else if (fmt.id==='f45') { iX=W*0.04;iY=H*0.04;iW=W*0.92;iH=H*0.46; tX=40;tY=H*0.53;tMaxW=W*0.88; }
  else                      { iX=W*0.07;iY=H*0.05;iW=W*0.86;iH=H*0.47; tX=38;tY=H*0.54;tMaxW=W*0.84; }

  imgContain(ctx,img,iX,iY,iW,iH,v.product?.code||'');
  if (v.badge) drawBadge(ctx,v.badge,W-68,28,cs.accent,cs.btnText,11);
  drawLogo(ctx,W-16,H-14,cs.textMuted,11);

  let ty=tY;
  const big = !portrait;
  const hlSz = big?44:36, hlLh = big?52:44;
  if (v.subheadline) {
    ctx.fillStyle=cs.accent; ctx.font=`600 ${big?12:13}px "DM Sans",sans-serif`;
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(v.subheadline.toUpperCase(),tX,ty); ty+=big?24:26;
  }
  ctx.fillStyle=cs.text; ctx.font=`800 ${hlSz}px "DM Sans",sans-serif`;
  ctx.textAlign='left'; ctx.textBaseline='top';
  ty+=wrapText(ctx,v.headline,tX,ty,tMaxW,hlLh)*hlLh+12;
  if (v.price) {
    ctx.fillStyle=cs.accent; ctx.font=`800 ${big?28:24}px "DM Sans",sans-serif`;
    ctx.fillText(v.price,tX,ty); ty+=big?44:38;
  }
  if (v.cta) {
    ctx.font=`700 15px "DM Sans",sans-serif`;
    const cW=Math.min(ctx.measureText(v.cta).width+44,260), cH=big?46:42;
    drawBtn(ctx,v.cta,tX,Math.min(ty,H-cH-24),cW,cH,cs.btnBg,cs.btnText);
  }
}

function tplArrowBenefits(ctx, v, fmt, img) {
  const cs=getScheme(v.colorScheme), W=fmt.width, H=fmt.height;
  const isDark = cs.bg.startsWith('#1')||cs.bg.startsWith('#0')||cs.bg.startsWith('#2');
  const bg1=isDark?'#f8f8f8':cs.bg, bg2=isDark?'#efefef':cs.bg2;
  drawGradBg(ctx,W,H,bg1,bg2,150);
  const textC=isDark?'#1a1a1a':cs.text, arrowC=cs.accent;

  let pCx,pCy,pSz;
  if (fmt.id==='f169')     { pCx=W*0.50; pCy=H*0.50; pSz=H*0.70; }
  else if (fmt.id==='f11') { pCx=W*0.50; pCy=H*0.47; pSz=H*0.58; }
  else if (fmt.id==='f45') { pCx=W*0.50; pCy=H*0.46; pSz=H*0.44; }
  else                     { pCx=W*0.50; pCy=H*0.44; pSz=H*0.36; }
  const pR = pSz*0.5;
  ctx.save(); ctx.globalAlpha=0.05; ctx.fillStyle=arrowC;
  ctx.beginPath(); ctx.ellipse(pCx,pCy,pR*1.1,pR*1.1,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  imgContain(ctx,img,pCx-pSz/2,pCy-pSz/2,pSz,pSz,v.product?.code||'');

  const bens=(v.benefits||[]).slice(0,8);
  const bSz=fmt.id==='f916'?11:(fmt.id==='f45'?12:13);
  const bMaxW=fmt.id==='f169'?W*0.17:W*0.26;

  function buildPositions(count) {
    const pos=[];
    if (fmt.id==='f11') {
      const defs=[
        {a:'right',tx:pCx-pR-16,ty:pCy-pR*0.5,tipX:pCx-pR,tipY:pCy-pR*0.25},
        {a:'right',tx:pCx-pR-16,ty:pCy+pR*0.4,tipX:pCx-pR,tipY:pCy+pR*0.2},
        {a:'left', tx:pCx+pR+16,ty:pCy-pR*0.5,tipX:pCx+pR,tipY:pCy-pR*0.25},
        {a:'left', tx:pCx+pR+16,ty:pCy+pR*0.4,tipX:pCx+pR,tipY:pCy+pR*0.2},
        {a:'right',tx:pCx-pR-16,ty:pCy-pR*1.35,tipX:pCx-pR*0.6,tipY:pCy-pR},
        {a:'left', tx:pCx+pR+16,ty:pCy-pR*1.35,tipX:pCx+pR*0.6,tipY:pCy-pR},
        {a:'right',tx:pCx-pR-16,ty:pCy+pR*1.35,tipX:pCx-pR*0.6,tipY:pCy+pR},
        {a:'left', tx:pCx+pR+16,ty:pCy+pR*1.35,tipX:pCx+pR*0.6,tipY:pCy+pR},
      ];
      return defs.slice(0,count);
    }
    if (fmt.id==='f169') {
      const half=Math.floor(count/2), rem=count-half;
      const lx=pCx-pR-W*0.05, rx=pCx+pR+W*0.01;
      const lyStep=H/(half+1), ryStep=H/(rem+1);
      for(let i=0;i<half;i++) pos.push({a:'right',tx:lx,ty:lyStep*(i+1),tipX:pCx-pR,tipY:pCy+(i-(half-1)/2)*pR*0.7});
      for(let i=0;i<rem;i++)  pos.push({a:'left', tx:rx,ty:ryStep*(i+1),tipX:pCx+pR,tipY:pCy+(i-(rem-1)/2)*pR*0.7});
      return pos;
    }
    const side=Math.floor(count/2), rem2=count-side;
    const yStep=pSz*0.95/Math.max(side,1), startY=pCy-pSz*0.38;
    const lx2=pCx-pR-14, rx2=pCx+pR+14;
    for(let i=0;i<side;i++) pos.push({a:'right',tx:lx2,ty:startY+i*yStep,tipX:pCx-pR,tipY:startY+i*yStep});
    for(let i=0;i<rem2;i++) pos.push({a:'left', tx:rx2,ty:startY+i*yStep,tipX:pCx+pR,tipY:startY+i*yStep});
    return pos;
  }

  const positions=buildPositions(bens.length||4);
  bens.forEach((ben,i)=>{
    const p=positions[i]; if(!p)return;
    ctx.save(); ctx.fillStyle=textC; ctx.font=`600 ${bSz}px "DM Sans",sans-serif`;
    ctx.textAlign=p.a; ctx.textBaseline='middle';
    const words=ben.split(' '); const lines=[]; let line='';
    for(const w of words){const t=line?line+' '+w:w; if(ctx.measureText(t).width>bMaxW&&line){lines.push(line);line=w;}else line=t;}
    if(line)lines.push(line);
    const lh=bSz+5, bH=lines.length*lh;
    lines.forEach((l,li)=>ctx.fillText(l,p.tx,p.ty-bH/2+li*lh+lh/2));
    ctx.restore();
    const dX=p.a==='right'?p.tx+6:p.tx-6;
    ctx.save(); ctx.fillStyle=arrowC; ctx.beginPath(); ctx.arc(dX,p.ty,3,0,Math.PI*2); ctx.fill(); ctx.restore();
    const aStartX=p.a==='right'?dX-10:dX+10;
    drawArrow(ctx,aStartX,p.ty,p.tipX,p.tipY,arrowC,1.2,7);
  });
  drawLogo(ctx,W-16,H-14,isDark?'#aaaaaa':cs.textMuted,11);
  if (v.headline) {
    ctx.fillStyle=cs.accent; ctx.font=`700 ${bSz+1}px "DM Sans",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(v.headline,W/2,H-30);
  }
}

function tplHeroBanner(ctx, v, fmt, img) {
  const cs=getScheme(v.colorScheme), W=fmt.width, H=fmt.height;
  ctx.fillStyle=cs.bg; ctx.fillRect(0,0,W,H);
  const portrait=fmt.id==='f45'||fmt.id==='f916';

  let tX,tY,tMaxW,iX,iY,iW,iH;

  else if (fmt.id==='f11') { tX=34;tY=H*0.14;tMaxW=W*0.38; iX=W*0.44;iY=H*0.10;iW=W*0.52;iH=H*0.80; }
  else if (fmt.id==='f45') { tX=30;tY=H*0.06;tMaxW=W*0.88; iX=W*0.05;iY=H*0.44;iW=W*0.90;iH=H*0.48; }

  imgContain(ctx,img,iX,iY,iW,iH,'');

  ctx.font=`800 ${portrait?38:44}px "DM Sans",sans-serif`; ctx.textAlign='left'; ctx.textBaseline='top';
  ty+=wrapText(ctx,v.headline,tX,ty,tMaxW,portrait?46:52)*(portrait?46:52)+12;

function tplPricePromo(ctx, v, fmt, img) {

function tplDarkLuxury(ctx, v, fmt, img) {
  const W=fmt.width, H=fmt.height;
  const cs={ bg:'#0d0d1a',bg2:'#1a0a2e',accent:'#d4af37',text:'#fff',textMuted:'rgba(255,255,255,0.5)',btnBg:'#d4af37',btnText:'#0d0d1a' };
  drawGradBg(ctx,W,H,cs.bg,cs.bg2);
  const cm=22, cl=18;
  ctx.save(); ctx.strokeStyle=cs.accent; ctx.lineWidth=1.5; ctx.globalAlpha=0.4;
  [[cm,cm,cm+cl,cm],[cm,cm,cm,cm+cl],[W-cm,cm,W-cm-cl,cm],[W-cm,cm,W-cm,cm+cl],
   [cm,H-cm,cm+cl,H-cm],[cm,H-cm,cm,H-cm-cl],[W-cm,H-cm,W-cm-cl,H-cm],[W-cm,H-cm,W-cm,H-cm-cl]
  ].forEach(([x1,y1,x2,y2])=>{ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); });
  ctx.restore();
  const portrait=fmt.id==='f45'||fmt.id==='f916';
  const gCx=portrait?W/2:W*0.67, gCy=portrait?H*0.38:H*0.5, gR=Math.min(W,H)*0.38;
  const grd=ctx.createRadialGradient(gCx,gCy,0,gCx,gCy,gR);
  grd.addColorStop(0,hexToRgba(cs.accent,0.14)); grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);

  let iX,iY,iW,iH,tX,tY,tMaxW;
  if (fmt.id==='f169')     { iX=W*0.41;iY=H*0.08;iW=W*0.54;iH=H*0.84; tX=48;tY=H*0.16;tMaxW=W*0.36; }
  else if (fmt.id==='f11') { iX=W*0.42;iY=H*0.12;iW=W*0.52;iH=H*0.76; tX=42;tY=H*0.16;tMaxW=W*0.36; }
  else if (fmt.id==='f45') { iX=W*0.05;iY=H*0.06;iW=W*0.90;iH=H*0.42; tX=42;tY=H*0.52;tMaxW=W*0.88; }
  else                     { iX=W*0.08;iY=H*0.06;iW=W*0.84;iH=H*0.40; tX=42;tY=H*0.50;tMaxW=W*0.84; }
  imgContain(ctx,img,iX,iY,iW,iH,'');
  if (v.badge) drawBadge(ctx,v.badge,W-66,28,cs.accent,cs.btnText,11);
  ctx.save(); ctx.strokeStyle=cs.accent; ctx.lineWidth=1.5; ctx.globalAlpha=0.5;
  ctx.beginPath(); ctx.moveTo(tX,tY-14); ctx.lineTo(tX+Math.min(tMaxW*0.55,170),tY-14); ctx.stroke(); ctx.restore();

  let ty=tY;
  ctx.fillStyle=cs.text; ctx.font=`800 ${portrait?34:42}px "DM Sans",sans-serif`;
  ctx.textAlign='left'; ctx.textBaseline='top';
  ty+=wrapText(ctx,v.headline,tX,ty,tMaxW,portrait?42:50)*(portrait?42:50)+12;
  if (v.subheadline) {
    ctx.fillStyle=cs.textMuted; ctx.font=`400 15px "DM Sans",sans-serif`;
    ty+=wrapText(ctx,v.subheadline,tX,ty,tMaxW,22)*22+12;
  }
  if (v.price) {
    ctx.fillStyle=cs.accent; ctx.font=`800 28px "DM Sans",sans-serif`;
    ctx.fillText(v.price,tX,ty); ty+=44;
  }
  if (v.cta) drawBtn(ctx,v.cta,tX,Math.min(ty,H-70),200,46,cs.btnBg,cs.btnText);
  drawLogo(ctx,W-16,H-14,cs.textMuted,11);
}

async function renderToCanvas(canvas, v, fmt, product) {
  canvas.width=fmt.width; canvas.height=fmt.height;
  const ctx=canvas.getContext('2d');
  const url=v.imageUrl||(product?.packshot)||null;
  const img=url?await loadImg(url):null;
  switch(v.template) {
    case 'clean_packshot': tplCleanPackshot(ctx,v,fmt,img); break;
    case 'arrow_benefits': tplArrowBenefits(ctx,v,fmt,img); break;
    case 'hero_banner':    tplHeroBanner(ctx,v,fmt,img);    break;
    case 'price_promo':    tplPricePromo(ctx,v,fmt,img);    break;
    case 'dark_luxury':    tplDarkLuxury(ctx,v,fmt,img);    break;
    default:               tplCleanPackshot(ctx,v,fmt,img);
  }
}

async function genPreviews(v, product) {
  v.previews={};
  for (const fmt of FORMATS) {
    try {
      const c=document.createElement('canvas');
      await renderToCanvas(c,v,fmt,product);
      v.previews[fmt.id]=c.toDataURL('image/png');
    } catch { v.previews[fmt.id]=''; }
  }
}

function parseBenList(html) {
  if (!html) return [];
  const d=document.createElement('div'); d.innerHTML=html;
  const lis=d.querySelectorAll('ul li');
  if (lis.length>=2) return [...lis].map(l=>l.textContent.trim()).filter(Boolean).slice(0,8);
  return [];
}

function normalizeProduct(raw) {
  const imgs=(raw.images||[]).map(i=>(typeof i==='string'?i:i.url)).filter(Boolean);
  const rawBens=parseBenList(raw.description);
  const paramBens=(raw.parameters||[])
    .filter(p=>p.value&&p.value!=='Ne'&&p.value!=='Ano')
    .map(p=>`${p.name}: ${p.value}`).slice(0,6);
  const bens = rawBens.length>=2 ? rawBens
    : paramBens.length>=2 ? paramBens
    : ['Osvědčená kvalita','Přírodní složení','Viditelné výsledky','Šetrné k pokožce','Pro každý den','Testováno dermatology'];
  return {
    id:String(raw.id||uid()),
    title:raw.title||`Produkt ${raw.id}`,
    code:raw.code||'',
    price:Number(raw.price?.withVat||raw.price||0),
    packshot:imgs[0]||null,
    altImages:imgs.slice(1),
    description:raw.description||'',
    parameters:raw.parameters||[],
    benefits:bens,
    stock:Number(raw.inStore||raw.stock||0),
  };
}

function parseHeurekaXML(doc) {
  // Works with both uppercase XML and lowercase HTML-parsed documents
  const sel = n => doc.querySelector(n) ? n : n.toLowerCase();
  const items = [...(doc.querySelectorAll('SHOPITEM').length
    ? doc.querySelectorAll('SHOPITEM')
    : doc.querySelectorAll('shopitem'))];
  return items.map(item => {
    const t = tag => {
      const el = item.querySelector(tag) || item.querySelector(tag.toLowerCase());
      return el?.textContent?.trim()||'';
    };
    const id    = t('ITEM_ID')||t('ID')||uid();
    const title = t('PRODUCTNAME')||t('PRODUCT_NAME')||t('NAME')||'';
    const price = parseFloat((t('PRICE_VAT')||t('PRICE')||'0').replace(',','.'));
    const imgUrls = [
      ...item.querySelectorAll('IMGURL'),
      ...item.querySelectorAll('imgurl'),
    ].map(el=>el.textContent.trim());
    const altImgs = [
      ...item.querySelectorAll('IMGURL_ALTERNATIVE'),
      ...item.querySelectorAll('imgurl_alternative'),
    ].map(el=>el.textContent.trim());
    const imgs = [...new Set([...imgUrls, ...altImgs])].filter(Boolean);
    const paramEls = [...item.querySelectorAll('PARAM'), ...item.querySelectorAll('param')];
    const params = paramEls.map(p=>({
      name: (p.querySelector('PARAM_NAME')||p.querySelector('param_name'))?.textContent?.trim()||'',
      value:(p.querySelector('VAL')||p.querySelector('val'))?.textContent?.trim()||'',
    }));
    return normalizeProduct({
      id, title, code: t('EAN')||t('PRODUCT_CODE')||id,
      price:{withVat:price},
      images:imgs,
      description:t('DESCRIPTION'),
      parameters:params,
      inStore:t('DELIVERY_DATE')==='0'?10:0,
    });
  }).filter(p=>p.title);
}

function parseGoogleXML(doc) {
  const NS='http://base.google.com/ns/1.0';
  return [...doc.querySelectorAll('item')].map(item=>{
    const t  = tag => item.querySelector(tag)?.textContent?.trim()||'';
    const tg = tag => item.getElementsByTagNameNS(NS,tag)[0]?.textContent?.trim()||'';
    const id    = tg('id')||t('guid')||uid();
    const title = tg('title')||t('title')||'';
    const prStr = tg('price')||t('price')||'0';
    const price = parseFloat(prStr.replace(/[^\d.,]/g,'').replace(',','.'));
    const imgs  = [tg('image_link')||'',
                   ...[...item.getElementsByTagNameNS(NS,'additional_image_link')].map(el=>el.textContent.trim())
                  ].filter(Boolean);
    return normalizeProduct({
      id, title, code:tg('mpn')||tg('gtin')||id,
      price:{withVat:price},
      images:imgs,
      description:tg('description')||t('description'),
      parameters:[],
      inStore:(tg('availability')||'').includes('in_stock')?10:0,
    });
  }).filter(p=>p.title);
}

function parseJSONFeed(json) {
  let items=[];
  if (Array.isArray(json))          items=json;
  else if (json.items)              items=json.items;
  else if (json.products)           items=json.products;
  else if (json.data?.items)        items=json.data.items;
  else if (json.data?.products)     items=json.data.products;
  return items.map(raw=>{
    const imgs=(raw.images||[]).map(i=>(typeof i==='string'?i:i.url||i.imgUrl||'')).filter(Boolean);
    if (!imgs.length && (raw.imgurl||raw.img_url||raw.image)) imgs.push(raw.imgurl||raw.img_url||raw.image);
    return normalizeProduct({
      id:String(raw.id||raw.ID||uid()),
      title:raw.title||raw.name||raw.productname||'',
      code:raw.code||raw.ean||raw.mpn||'',
      price:{withVat:Number(raw.price_vat||raw.price||raw.priceVat||0)},
      images:imgs.filter(Boolean),
      description:raw.description||raw.desc||'',
      parameters:raw.parameters||raw.params||[],
      inStore:Number(raw.inStore||raw.stock||raw.quantity||0),
    });
  }).filter(p=>p.title);
}

async function fetchWithCorsFallback(url) {
  const T = 25000;
  const isDefaultFeed = url === DEFAULT_FEED || url.includes('kralovstvi-tiande.cz/feed');

  // helper: is the body actually feed content (not a status/error JSON)?
  const isFeedContent = text => {
    const t = text.trimStart();
    // XML feed
    if (t.startsWith('<?xml') || t.startsWith('<SHOP') || t.startsWith('<shop') || t.startsWith('<rss')) return true;
    // JSON array/items (not a {ok:true} status object)
    if (t.startsWith('[')) return true;
    if (t.startsWith('{')) {
      try {
        const j = JSON.parse(t);
        return Array.isArray(j.items||j.products||j.data?.items) && (j.items||j.products||j.data?.items).length > 0;
      } catch { return false; }
    }
    return false;
  };

  // 1. Own Worker proxy /feed (only if worker has the endpoint deployed)
  if (isDefaultFeed) {
    try {
      const r = await fetch(FEED_PROXY, { signal: AbortSignal.timeout(T) });
      if (r.ok) {
        const text = await r.text();
        if (isFeedContent(text)) {
          console.info('[feed] loaded via tiande-proxy worker');
          return { text };
        }
        console.warn('[feed] worker returned non-feed content (endpoint not deployed yet?)');
      }
    } catch(e) { console.warn('[feed] worker proxy failed:', e.message); }
  }

  // 2. Direct fetch (works if server allows CORS)
  try {
    const r = await fetch(url, { signal: AbortSignal.timeout(T) });
    if (r.ok) {
      const text = await r.text();
      if (isFeedContent(text)) { console.info('[feed] loaded directly'); return { text }; }
    }
  } catch(_) { /* CORS/network */ }

  // 3. Public CORS proxies
  const proxies = [
    { label: 'corsproxy.io',
      getUrl: u => 'https://corsproxy.io/?' + encodeURIComponent(u),
      extract: async r => r.text() },
    { label: 'allorigins.win',
      getUrl: u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
      extract: async r => r.json().then(j => j.contents||'') },
  ];
  for (const p of proxies) {
    try {
      const r = await fetch(p.getUrl(url), { signal: AbortSignal.timeout(T) });
      if (r.ok) {
        const text = await p.extract(r);
        if (isFeedContent(text)) { console.info(`[feed] loaded via ${p.label}`); return { text }; }
        console.warn(`[feed] ${p.label} returned non-feed content`);
      }
    } catch(e) { console.warn(`[feed] ${p.label} failed:`, e.message); }
  }

  throw new Error('Nelze načíst feed. Worker proxy není nasazen nebo je URL nedostupná.');
}

async function loadFeedProducts() {
  const url = $('inp-feed-url').value.trim();
  if (!url) throw new Error('Zadejte URL feedu');
  localStorage.setItem(FEED_URL_KEY, url);

  const { text } = await fetchWithCorsFallback(url);

  // Log snippet for debugging
  console.info('[feed] content preview:', text.slice(0, 300));

  // JSON?
  const trimmed = text.trimStart();
  if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
    try { return parseJSONFeed(JSON.parse(text)); } catch {}
  }

  // XML — parse both as proper XML and as HTML (HTML lowercases tags, more forgiving)
  const xmlDoc = new DOMParser().parseFromString(text, 'application/xml');
  const htmlDoc = new DOMParser().parseFromString(text, 'text/html');
  const hasParseErr = !!xmlDoc.querySelector('parsererror');

  // Log detected root/first elements
  console.info('[feed] xmlDoc root:', xmlDoc.documentElement?.tagName,
    '| first child:', xmlDoc.documentElement?.firstElementChild?.tagName);
  console.info('[feed] htmlDoc body first child:', htmlDoc.body?.firstElementChild?.tagName);

  // Heureka: SHOPITEM (uppercase XML) or shopitem (HTML-parsed lowercase)
  if (!hasParseErr && xmlDoc.querySelector('SHOPITEM')) { console.info('[feed] → Heureka XML'); return parseHeurekaXML(xmlDoc); }
  if (htmlDoc.querySelector('shopitem'))                { console.info('[feed] → Heureka HTML'); return parseHeurekaXML(htmlDoc); }

  // Google Shopping RSS: <item> elements
  if (!hasParseErr && xmlDoc.querySelector('item'))     { console.info('[feed] → Google XML'); return parseGoogleXML(xmlDoc); }
  if (htmlDoc.querySelector('item'))                    { console.info('[feed] → Google HTML'); return parseGoogleXML(htmlDoc); }

  if (hasParseErr) throw new Error('Neplatný XML – ' + (xmlDoc.querySelector('parsererror')?.textContent||'').slice(0,120));
  throw new Error(`Nerozpoznaný formát feedu. Root tag: <${xmlDoc.documentElement?.tagName}>. Podpora: Heureka XML (SHOPITEM), Google Shopping RSS (item), JSON.`);
}

// ─────────────────────────────────────────────
function makeHeadlines(product) {
  const n=product.title, s=n.split(' ').slice(0,3).join(' ');
  return [n,`Objevte ${s}`,`${s} – výsledky, které vidíte`,`Přirozená péče s ${s}`,
          `Síla přírody v každé kapce`,`Váš rituál pro krásu`,`${s} pro každý den`,`Pocit luxusu každý den`];
}

async function generateVariants(product, config) {
  const {count, enabledTemplates} = config;
  const headlines=makeHeadlines(product);
  const pool=TEMPLATES.filter(t=>enabledTemplates.includes(t.id));
  if (!pool.length) return [];
  const variants=[];
  for(let i=0;i<count;i++){
    const v={
      id:uid(),
      product:{id:product.id,title:product.title,code:product.code},
      template: i===0?'clean_packshot':pick(pool,i).id,
      colorScheme: i===0?'gold_dark':pick(COLOR_SCHEMES,i+1).id,
      headline: headlines[i%headlines.length],
      subheadline: i%3===0?'':(i%3===1?'Prémiová péče':'Království tianDe'),
      cta: pick(CTA_OPTIONS,i),
      badge: pick(BADGE_OPTIONS,i),
      price: formatPrice(product.price),
      benefits: [...product.benefits].slice(0,i%2===0?4:6),
      imageUrl: product.packshot,
      imageMode:'packshot',
      status:'pending',
      notes:'',
      previews:{},
    };
    variants.push(v);
  }
  for(let i=0;i<variants.length;i++){
    setProgress(Math.round((i/variants.length)*90), 'Generuji bannery…', `Varianta ${i+1} / ${variants.length}`);
    await genPreviews(variants[i],product);
  }
  return variants;
}

}

async function exportBulkZIP(variants) {
  if(!variants.length){ showToast('Žádné schválené varianty','error'); return; }
  showOverlay('Generuji ZIP…','Kreslím bannery');
  const zip=new JSZip();
  const manifest={generated:new Date().toISOString(),product:APP.selectedProduct?.title,variants:[]};
  for(let i=0;i<variants.length;i++){
    const v=variants[i];
    setProgress(Math.round(i/variants.length*90), 'Generuji ZIP…', `Varianta ${i+1} / ${variants.length}`);
    const folder=zip.folder(`varianta_${v.id}`);
    for(const fmt of FORMATS){
      try{
        const c=document.createElement('canvas');
        await renderToCanvas(c,v,fmt,APP.products.find(p=>p.id===v.product?.id)||null);
        folder.file(`${fmt.name.replace(':','-')}.png`,c.toDataURL('image/png').split(',')[1],{base64:true});
      }catch{}
    }
    manifest.variants.push({id:v.id,template:v.template,colorScheme:v.colorScheme,headline:v.headline,status:v.status});
  }
  setProgress(95,'Komprimuji…','');
  zip.file('manifest.json',JSON.stringify(manifest,null,2));
  const blob=await zip.generateAsync({type:'blob'});
  hideOverlay();
  downloadBlob(blob,'tiande_bannery.zip');
  showToast(`ZIP: ${variants.length} variant × 4 formáty`);
}

function updateFilterCounts() {
  const all=APP.variants.length;
  const pending =APP.variants.filter(v=>v.status==='pending').length;
  const approved=APP.variants.filter(v=>v.status==='approved').length;
  const rejected=APP.variants.filter(v=>v.status==='rejected').length;
  $('tc-all').textContent=all;
  $('tc-pending').textContent=pending;
  $('tc-approved').textContent=approved;
  $('tc-rejected').textContent=rejected;
}

function filteredVariants() {
  if (APP.activeFilter==='all') return APP.variants;
  return APP.variants.filter(v=>v.status===APP.activeFilter);
}

function variantCardHTML(v) {
  const tmpl=TEMPLATES.find(t=>t.id===v.template)||TEMPLATES[0];
  const cs=getScheme(v.colorScheme);
  const sCls={pending:'status-pending',approved:'status-approved',rejected:'status-rejected'}[v.status];
  const sLbl={pending:'Čeká',approved:'Schváleno',rejected:'Zamítnuto'}[v.status];

  const showFormats = APP.activeFormat==='all' ? FORMATS : FORMATS.filter(f=>f.id===APP.activeFormat);
  const gridCls = showFormats.length===1 ? 'g1' : 'g4';

  const prevs=showFormats.map(f=>`
    <div class="vp-item">
      ${v.previews[f.id]
        ?`<img class="vp-img" src="${v.previews[f.id]}" style="aspect-ratio:${f.width}/${f.height}" loading="lazy" />`
        :`<div class="vp-img" style="aspect-ratio:${f.width}/${f.height};background:#1a2235"></div>`}
      <div class="vp-label">${f.name}</div>
    </div>`).join('');

  const cardCls = v.status==='approved'?' is-approved' : v.status==='rejected'?' is-rejected':'';
  return `<div class="variant-card${cardCls}" id="vcard-${v.id}">
    <div class="vc-hdr">
      <div class="vc-meta">
        <span class="scheme-dot" style="background:${cs.accent}"></span>
        <span class="vc-tpl">${tmpl.icon} ${tmpl.name}</span>
      </div>
      <span class="status-badge ${sCls}">${sLbl}</span>
    </div>
    <div class="vc-headline" title="${v.headline}">${v.headline}</div>
    <div class="vc-previews ${gridCls}">${prevs}</div>
    <div class="vc-actions">
      <button class="btn btn-outline btn-sm" data-approve="${v.id}" title="Schválit">✓</button>
      <button class="btn btn-outline btn-sm" data-reject="${v.id}"  title="Zamítnout">✗</button>
      <button class="btn btn-outline btn-sm" data-edit="${v.id}">✏ Upravit</button>
      <button class="btn btn-outline btn-sm" data-dup="${v.id}"   title="Duplikovat">⧉</button>
      <button class="btn btn-outline btn-sm" data-regen="${v.id}" title="Regenerovat">↺</button>
    </div>
  </div>`;
}

function renderVariantGrid() {
  if (APP.selectedProduct) $('ws-product-name').textContent=APP.selectedProduct.title;
  updateFilterCounts();
  const grid=$('variant-grid');
  const fv=filteredVariants();
  if(!fv.length){
    grid.innerHTML=`<div style="padding:40px;color:rgba(255,255,255,0.3);grid-column:1/-1">${APP.activeFilter==='all'?'Žádné varianty':'Žádné varianty v tomto stavu'}</div>`;
    return;
  }
  grid.innerHTML=fv.map(variantCardHTML).join('');
}

function updateCard(v) {
  const old=$(`vcard-${v.id}`);
  if(old){ const tmp=document.createElement('div'); tmp.innerHTML=variantCardHTML(v); old.replaceWith(tmp.firstChild); }
  updateFilterCounts();
}

        <button class="asset-btn${v.imageMode==='lifestyle'?' active':''}" data-amode="lifestyle">Lifestyle</button>
        <button class="asset-btn${v.imageMode==='custom'?' active':''}" data-amode="custom">URL</button>
        <button class="asset-btn" id="btn-upload">Upload</button>
      </div>
      <input type="url" id="ed-imgurl" placeholder="https://…" value="${v.imageUrl||''}" ${v.imageMode!=='custom'?'style="display:none"':''} />
      <input type="file" id="inp-file" accept="image/*" class="hidden" />
    </div>
    <div class="ed-footer">
      <button class="btn btn-outline" id="btn-ed-rej">✗ Zamítnout</button>
      <button class="btn btn-primary" id="btn-ed-app">✓ Schválit</button>
    </div>`;

function readEditorIntoVariant(v) {
  v.headline    = $('ed-hl')?.value    || v.headline;
  v.subheadline = $('ed-sh')?.value    || '';
  v.cta         = $('ed-cta')?.value   || '';
  v.badge       = $('ed-badge')?.value || '';
  v.price       = $('ed-price')?.value || '';
  v.benefits    = [...document.querySelectorAll('[data-bi]')].map(i=>i.value).filter(Boolean);
}

function scheduleEditorRefresh(v) {
  clearTimeout(edTimer);
  edTimer=setTimeout(async()=>{
    const product=APP.products.find(p=>p.id===v.product?.id)||null;
    await genPreviews(v,product);
    FORMATS.forEach(f=>{ const el=$(`epv-${f.id}`); if(el) el.src=v.previews[f.id]||''; });
    updateCard(v);
  },400);
}

function bindEditorFields(v) {
  const sched=()=>{ readEditorIntoVariant(v); scheduleEditorRefresh(v); };
  ['ed-hl','ed-sh','ed-cta','ed-badge','ed-price'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('input',sched); });
  $('editor-fields').addEventListener('input', e=>{ if(e.target.dataset.bi!==undefined) sched(); });
  $('editor-fields').addEventListener('click', e=>{
    const t=e.target;
    if(t.dataset.setTpl) { readEditorIntoVariant(v); v.template=t.dataset.setTpl; buildEditorFields(v); sched(); }
    if(t.dataset.setCs)  { readEditorIntoVariant(v); v.colorScheme=t.dataset.setCs; buildEditorFields(v); sched(); }
    if(t.dataset.biDel!==undefined) { readEditorIntoVariant(v); v.benefits.splice(+t.dataset.biDel,1); buildEditorFields(v); sched(); }
    if(t.dataset.biUp!==undefined)  { readEditorIntoVariant(v); const i=+t.dataset.biUp; if(i>0)[v.benefits[i-1],v.benefits[i]]=[v.benefits[i],v.benefits[i-1]]; buildEditorFields(v); sched(); }
    if(t.dataset.amode) {
      readEditorIntoVariant(v);
      v.imageMode=t.dataset.amode;
      const prod=APP.products.find(p=>p.id===v.product?.id);
      if(t.dataset.amode==='packshot')  v.imageUrl=prod?.packshot||null;
      if(t.dataset.amode==='lifestyle') v.imageUrl=prod?.altImages?.[0]||prod?.packshot||null;
      buildEditorFields(v); sched();
    }
    if(t.id==='btn-add-ben') { readEditorIntoVariant(v); v.benefits.push('Nový benefit'); buildEditorFields(v); sched(); }
    if(t.id==='btn-upload') $('inp-file').click();
    if(t.id==='btn-ed-app') { v.status='approved'; updateCard(v); closeEditor(); showToast('Schváleno ✓'); }
    if(t.id==='btn-ed-rej') { v.status='rejected'; updateCard(v); closeEditor(); }
  });
  $('editor-previews').addEventListener('click', e=>{
    if(e.target.dataset.dlFmt) exportPNG(v,e.target.dataset.dlFmt);
  });
  const urlInp=$('ed-imgurl');
  if(urlInp) urlInp.addEventListener('change',()=>{ v.imageUrl=urlInp.value; sched(); });
  const fileInp=$('inp-file');
  if(fileInp) fileInp.addEventListener('change',()=>{
    const f=fileInp.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=e=>{ v.imageUrl=e.target.result; v.imageMode='custom'; buildEditorFields(v); sched(); };
    r.readAsDataURL(f); fileInp.value='';
  });
}

// ─────────────────────────────────────────────
// EVENT BINDING
// ─────────────────────────────────────────────
function bindAll() {
  // Load feed
  $('btn-load-feed').onclick = triggerLoadFeed;

  // Search
  $('inp-search').addEventListener('input',e=>renderProductList(e.target.value));

  // Product click
  $('sidebar-products').addEventListener('click',e=>{
    const item=e.target.closest('.product-item'); if(!item)return;
    const p=APP.products.find(x=>x.id===item.dataset.pid); if(!p)return;
    APP.selectedProduct=p;
    renderProductList($('inp-search').value);
    renderConfigure(p);
    showStage('configure');
  });

  // Count slider
  $('cfg-count').addEventListener('input',e=>$('cfg-count-label').textContent=e.target.value);

  // Generate
  $('btn-generate').onclick=async()=>{
    if(!APP.selectedProduct)return;
    const count=+$('cfg-count').value;
    const enabled=[...document.querySelectorAll('input[name=tmpl]:checked')].map(c=>c.value);
    if(!enabled.length){ showToast('Vyberte alespoň jednu šablonu','error'); return; }
    showOverlay('Generuji bannery…','Připravuji varianty');
    try {
      APP.variants=await generateVariants(APP.selectedProduct,{count,enabledTemplates:enabled});
      setProgress(100,'Hotovo!','');
      await new Promise(r=>setTimeout(r,300));
      hideOverlay();
      showStage('workspace'); renderVariantGrid();
      showToast(`${APP.variants.length} variant vygenerováno`);
    } catch(e){ hideOverlay(); showToast(e.message,'error'); }
  };

  // Back
  $('btn-back').onclick=()=>showStage('configure');

  // Status filter tabs
  document.querySelectorAll('.ftab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      APP.activeFilter=btn.dataset.filter;
      renderVariantGrid();
    });
  });

  // Format toggle
  document.querySelectorAll('.fmt-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.fmt-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      APP.activeFormat=btn.dataset.fmt;
      renderVariantGrid();
    });
  });

  // Variant grid actions
  $('variant-grid').addEventListener('click',async e=>{
    const t=e.target;
    if(t.dataset.approve){ const v=APP.variants.find(x=>x.id===t.dataset.approve); if(v){v.status='approved';updateCard(v);showToast('Schváleno ✓');} }
    if(t.dataset.reject) { const v=APP.variants.find(x=>x.id===t.dataset.reject);  if(v){v.status='rejected';updateCard(v);} }
    if(t.dataset.edit)   openEditor(t.dataset.edit);
    if(t.dataset.dup) {
      const v=APP.variants.find(x=>x.id===t.dataset.dup); if(!v)return;
      const clone=JSON.parse(JSON.stringify(v)); clone.id=uid(); clone.status='pending';
      APP.variants.splice(APP.variants.indexOf(v)+1,0,clone);
      renderVariantGrid(); showToast('Duplikováno');
    }
    if(t.dataset.regen) {
      const idx=APP.variants.findIndex(x=>x.id===t.dataset.regen); if(idx<0)return;
      const orig=t.textContent; t.textContent='…'; t.disabled=true;
      try {
        const [nv]=await generateVariants(APP.selectedProduct,{count:1,enabledTemplates:TEMPLATES.map(x=>x.id)});
        if(nv){ APP.variants.splice(idx,1,nv); renderVariantGrid(); }
      } catch(e){ showToast(e.message,'error'); }
      finally { t.textContent=orig; t.disabled=false; }
    }
  });

  // Export bulk
  $('btn-export-bulk').onclick=()=>{
    const ok=APP.variants.filter(v=>v.status==='approved');
    if(!ok.length){ showToast('Nejsou schválené varianty','error'); return; }
    exportBulkZIP(ok);
  };

  // Save project
  $('btn-save-project').onclick=()=>{
    const p={
      id:APP.project?.id||uid(),
      name:APP.selectedProduct?.title||'Projekt',
      product:APP.selectedProduct?.title||'',
      productId:APP.selectedProduct?.id||'',
      variantCount:APP.variants.length,
      savedAt:new Date().toISOString(),
      variants:APP.variants,
    };
    APP.project=p; saveProjectLS(p);
    showToast('Projekt uložen 💾');
  };

  // Editor modal
  $('btn-close-editor').onclick=closeEditor;
  $('editor-modal').addEventListener('click',e=>{ if(e.target===$('editor-modal'))closeEditor(); });

  // Projects modal
  $('btn-projects').onclick=openProjects;
  $('btn-close-projects').onclick=()=>$('projects-modal').classList.add('hidden');
  $('projects-modal').addEventListener('click',e=>{ if(e.target===$('projects-modal'))$('projects-modal').classList.add('hidden'); });
  $('projects-list').addEventListener('click',async e=>{
    const t=e.target;
    if(t.dataset.loadP) {
      const proj=loadProjects().find(p=>p.id===t.dataset.loadP); if(!proj)return;
      APP.project=proj; APP.variants=proj.variants||[];
      APP.selectedProduct=APP.products.find(p=>p.id===proj.productId)||null;
      showOverlay('Načítám projekt…','Generuji náhledy');
      for(const v of APP.variants) if(!Object.keys(v.previews||{}).length) await genPreviews(v,APP.products.find(p=>p.id===v.product?.id)||null);
      hideOverlay();
      showStage('workspace'); renderVariantGrid();
      $('projects-modal').classList.add('hidden'); showToast('Projekt načten');
    }
    if(t.dataset.expP) { const p=loadProjects().find(x=>x.id===t.dataset.expP); if(p)exportProjJSON(p); }
    if(t.dataset.delP) { deleteProjectLS(t.dataset.delP); renderProjectsList(); showToast('Smazáno'); }
  });

  // Import JSON
  $('btn-import-json').onclick=()=>$('inp-import-file').click();
  $('inp-import-file').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=ev=>{
      try{
        const p=JSON.parse(ev.target.result);
        if(!p.id)p.id=uid(); p.savedAt=new Date().toISOString();
        saveProjectLS(p); renderProjectsList(); showToast('Importováno');
      } catch{ showToast('Neplatný JSON','error'); }
    }; r.readAsText(f); e.target.value='';
  });

  // Bundles
  $('btn-new-bundle').onclick=()=>{
    const name=prompt('Název bundlu:'); if(!name)return;
    APP.bundles.push({id:uid(),name,productIds:[]}); renderBundleList(); showToast('Bundle přidán');
  };
  $('bundle-list').addEventListener('click',e=>{
    if(e.target.dataset.delBundle){ APP.bundles=APP.bundles.filter(b=>b.id!==e.target.dataset.delBundle); renderBundleList(); }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      if(!$('editor-modal').classList.contains('hidden')) closeEditor();
      else if(!$('projects-modal').classList.contains('hidden')) $('projects-modal').classList.add('hidden');
    }
  });
}

    renderProductList();
    st.textContent=`✓ ${APP.products.length} produktů`;
    st.className='ok';
    if (APP.products.length) showToast(`Načteno ${APP.products.length} produktů`);
    else showToast('Feed načten, ale neobsahuje žádné produkty','error');
  } catch(e) {
    st.textContent='Chyba';
    st.className='err';
    showToast(e.message,'error');
    console.error('[feed]', e);
  } finally { btn.textContent='Načíst feed'; btn.disabled=false; }
}

function init() {
  const savedUrl=localStorage.getItem(FEED_URL_KEY);
  if (savedUrl) $('inp-feed-url').value=savedUrl;

  bindAll();
  showStage('select');
  renderBundleList();
  $('sidebar-count').textContent='0';

  // Auto-load feed on startup
  if ($('inp-feed-url').value.trim()) triggerLoadFeed();
}

document.fonts.ready.then(init);
  </script>
</body>
</html>
